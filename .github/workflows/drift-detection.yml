name: Drift Detection
 
on:
  schedule:
    - cron: "0 2 * * *"   # Runs at 2:00 AM UTC daily
  workflow_dispatch:       # Allow manual trigger for testing
 
permissions:
  contents: read
  issues: write
 
env:
  TF_VERSION: "1.13.1"
  AWS_REGION: "us-east-1"
 
jobs:
  detect-drift:
    name: Check Infrastructure for drift
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: ./terraform
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
 
      - name: Terraform Init
        run: terraform init 
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
      - name: Open Issue on Drift
        if: steps.plan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Infrastructure Drift Detected `;
            const body = `## Drift Detected`
 
            The nightly drift detection job found differences between the
            Terraform state and the actual infrastructure.
 
            **Branch:** main
            **Run:** [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
 
            ### Action Required
            1. Review the plan output in the workflow logs
            2. Determine whether the drift was intentional
            3. If unintentional, re-run the deploy workflow to reconcile
            4. If intentional, update the Terraform code to match
 
            /cc @${{ github.repository_owner }}`;
 
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["drift"]
            });